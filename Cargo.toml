[package]
name = "sysgud"
version = "0.1.0"
edition = "2021"
description = "Autonomous, zero-latency system runtime agent for proactive terminal debugging and process remediation."

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
colored = "2.0"
anyhow = "1"
