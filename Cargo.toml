[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "signal", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
sysgud-core = { path = "crates/sysgud-core" }
sysgud-runtime = { path = "crates/sysgud-runtime" }
sysgud-api = { path = "crates/sysgud-api" }
sysgud-telegram = { path = "crates/sysgud-telegram" }

[package]
name = "sysgud"
version.workspace = true
edition.workspace = true
description = "Local process diagnostics with authenticated, durable approval of remediations."

[dependencies]
anyhow.workspace = true
axum.workspace = true
serde_json.workspace = true
tokio.workspace = true
sysgud-core.workspace = true
sysgud-runtime.workspace = true
sysgud-api.workspace = true
sysgud-telegram.workspace = true
dotenvy = "0.15"

[profile.release]
lto = "thin"
strip = true
